# config/stereo_pointcloud_params.yaml con wls_lambda 500 (variante estéreo de la evaluación anterior)
stereo_pointcloud:
  ros__parameters:
    left_image_topic: /navcam/left/navcam_left/image_raw
    right_image_topic: /navcam/right/navcam_right/image_raw
    left_info_topic: /navcam/left/navcam_left/camera_info
    right_info_topic: /navcam/right/navcam_right/camera_info
    output_topic: /navcam/pointcloud
    output_frame: navcam_left_optical_frame
    left_frame_id: navcam_left_optical_frame
    right_frame_id: navcam_right_optical_frame
    min_disparity: 0
    num_disparities: 96
    block_size: 7
    uniqueness_ratio: 5
    speckle_window: 100
    speckle_range: 2
    disp12_max_diff: 1
    min_depth: 0.3
    max_depth: 2.0
    scale_factor: 0.5
    wls_lambda: 500.0
    wls_sigma: 1.5
    accumulate_frames: 4
    sync_slop: 0.15
